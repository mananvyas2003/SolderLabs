name: SolderLab BSC Check
description: >
  Fail when the Board Support Contract has breaking changes versus the
  lockfile, and print firmware file:line call sites for affected symbols.
inputs:
  scan-dir:
    description: Firmware source directory to scan for affected symbols
    required: false
    default: src
  cwd:
    description: Working directory containing .bsc-lock.json
    required: false
    default: .
  registry:
    description: Optional path to BSC registry directory (sets --registry)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Run solderlab bsc check --scan
      shell: bash
      working-directory: ${{ inputs.cwd }}
      run: |
        set -euo pipefail
        ACTION_DIR="${{ github.action_path }}"
        REPO_ROOT="$(cd "$ACTION_DIR/../../.." && pwd)"
        CLI="$REPO_ROOT/packages/cli/bin/solderlab.mjs"
        if [[ ! -f "$CLI" ]]; then
          echo "SolderLab CLI not found at $CLI" >&2
          exit 1
        fi
        ARGS=(bsc check --scan "${{ inputs.scan-dir }}")
        if [[ -n "${{ inputs.registry }}" ]]; then
          ARGS+=(--registry "${{ inputs.registry }}")
        fi
        node "$CLI" "${ARGS[@]}"
