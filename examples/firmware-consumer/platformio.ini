# Minimal PlatformIO-style firmware consumer of a SolderLab BSC (Glasgow).
# Pull:  npm run solderlab -- bsc pull --board glasgow --rev newer --out include --format c --cwd examples/firmware-consumer
# Check: npm run solderlab -- bsc check --scan src --cwd examples/firmware-consumer

[env:native]
platform = native
build_flags = -Iinclude
